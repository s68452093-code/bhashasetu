name: Build debug APK

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/bhashasetu
          printf '%s\n' \
          'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' \
          'dependencyResolutionManagement { repositories { google(); mavenCentral() } }' \
          'rootProject.name = "BhashaSetu"' \
          "include ':app'" > settings.gradle
          printf '%s\n' \
          'plugins {' \
          "    id 'com.android.application' version '8.5.2' apply false" \
          '}' > build.gradle
          printf '%s\n' \
          'org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8' \
          'org.gradle.parallel=false' > gradle.properties
          printf '%s\n' \
          "plugins { id 'com.android.application' }" \
          'android {' \
          "    namespace 'com.example.bhashasetu'" \
          '    compileSdk 34' \
          '    defaultConfig { applicationId "com.example.bhashasetu"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }' \
          '    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }' \
          '}' > app/build.gradle
          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <application android:label="BhashaSetu">' \
          '        <activity android:name=".MainActivity" android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '        </activity>' \
          '    </application>' \
          '</manifest>' > app/src/main/AndroidManifest.xml
          printf '%s\n' \
          'package com.example.bhashasetu;' \
          '' \
          'import android.app.Activity;' \
          'import android.os.Bundle;' \
          'import android.widget.LinearLayout;' \
          'import android.widget.TextView;' \
          '' \
          'public class MainActivity extends Activity {' \
          '    @Override' \
          '    protected void onCreate(Bundle savedInstanceState) {' \
          '        super.onCreate(savedInstanceState);' \
          '        LinearLayout layout = new LinearLayout(this);' \
          '        layout.setOrientation(LinearLayout.VERTICAL);' \
          '        layout.setPadding(48, 96, 48, 48);' \
          '        TextView title = new TextView(this);' \
          '        title.setTextSize(28f);' \
          '        title.setText("BhashaSetu");' \
          '        TextView sub = new TextView(this);' \
          '        sub.setTextSize(16f);' \
          '        sub.setText("A bridge between sign and speech");' \
          '        layout.addView(title);' \
          '        layout.addView(sub);' \
          '        setContentView(layout);' \
          '    }' \
          '}' > app/src/main/java/com/example/bhashasetu/MainActivity.java
          echo "created:"; find . -name "*.gradle" -o -name "*.java" -o -name "AndroidManifest.xml" | sort

      - name: Build
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BhashaSetu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
