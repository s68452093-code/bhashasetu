name: Build debug APK

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/bhashasetu
          printf '%s\n' \
          'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' \
          'dependencyResolutionManagement { repositories { google(); mavenCentral() } }' \
          'rootProject.name = "BhashaSetu"' \
          "include ':app'" > settings.gradle
          printf '%s\n' \
          'plugins {' \
          "    id 'com.android.application' version '8.5.2' apply false" \
          "    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false" \
          '}' > build.gradle
          printf '%s\n' \
          'org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8' \
          'org.gradle.parallel=false' \
          'android.useAndroidX=true' > gradle.properties
          printf '%s\n' \
          "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }" \
          'android {' \
          "    namespace 'com.example.bhashasetu'" \
          '    compileSdk 34' \
          '    defaultConfig { applicationId "com.example.bhashasetu"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }' \
          '    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }' \
          "    kotlinOptions { jvmTarget = '17' }" \
          '}' \
          'dependencies { implementation "androidx.appcompat:appcompat:1.7.0" }' > app/build.gradle
          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <application android:label="BhashaSetu" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">' \
          '        <activity android:name=".MainActivity" android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '        </activity>' \
          '    </application>' \
          '</manifest>' > app/src/main/AndroidManifest.xml
          printf '%s\n' \
          'package com.example.bhashasetu' \
          '' \
          'import android.os.Bundle' \
          'import android.widget.TextView' \
          'import androidx.appcompat.app.AppCompatActivity' \
          '' \
          'class MainActivity : AppCompatActivity() {' \
          '    override fun onCreate(savedInstanceState: Bundle?) {' \
          '        super.onCreate(savedInstanceState)' \
          '        val view = TextView(this)' \
          '        view.text = "BhashaSetu"' \
          '        view.textSize = 22f' \
          '        setContentView(view)' \
          '    }' \
          '}' > app/src/main/java/com/example/bhashasetu/MainActivity.kt
          find . -name "*.gradle" -o -name "*.kt" -o -name "*.xml" | sort

      - name: Build
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BhashaSetu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
