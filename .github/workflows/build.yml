name: Build debug APK

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Retried: a flaky download here is the most common single failure.
      - name: Install SDK (with retries)
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            if "$SM" "platforms;android-34" "build-tools;34.0.0"; then
              echo "SDK ok on attempt $i"; exit 0
            fi
            echo "sdkmanager attempt $i failed, retrying in 10s"; sleep 10
          done
          echo "::warning::sdkmanager failed 3x; the preinstalled SDK will be used"
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The build script tries, in order:
      #   1. your existing project (if the repo has one)
      #   2. a generated Kotlin + appcompat project
      #   3. a generated pure-Java project with zero dependencies
      #   4. stage 3 with AGP 8.3.2, in case 8.5.2 cannot be resolved
      # Whatever builds first is copied to out/app-debug.apk.
      - name: Build (auto-fallback)
        run: bash build.sh

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BhashaSetu-debug-apk
          path: out/app-debug.apk
          if-no-files-found: error

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Show cause on failure
        if: failure()
        run: |
          {
            echo "### Build failed — first causes"
            echo '```'
            grep -E "What went wrong|Caused by:|error:|> Task .* FAILED|Execution failed for|FAILURE:|Unresolved reference|Could not (find|resolve|download|open|create)" build.log | tail -25 || echo "no pattern matched; see build-log artifact"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
