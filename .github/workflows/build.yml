# Build a debug APK on GitHub Actions.
# Save as: .github/workflows/android-build.yml
name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest          # SDK preinstalled at /usr/local/lib/android/sdk
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # AGP 8.x REQUIRES JDK 17. A default JDK 11 or 21 breaks the Gradle daemon
      # within seconds and prints only a daemon stack trace.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
