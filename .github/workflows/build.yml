name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Auto-prepare missing Gradle & project files
        shell: bash
        run: |
          python3 - <<'EOF'
          import os, glob

          # Find project root if nested inside a subfolder
          root = "."
          if not os.path.exists("app") and not os.path.exists("settings.gradle"):
              for candidate in glob.glob("*/app"):
                  root = os.path.dirname(candidate)
                  break

          os.chdir(root)
          print("Working in:", os.getcwd())

          os.makedirs("app/src/main/java/com/example/bhashasetu", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)

          def write_if_missing(path, content):
              if not os.path.exists(path):
                  os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Created missing:", path)

          write_if_missing("settings.gradle", """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BhashaSetu"
          include ':app'
          """)

          write_if_missing("build.gradle", """plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          """)

          write_if_missing("gradle.properties", """org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          """)

          write_if_missing("app/build.gradle", """plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.bhashasetu'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.bhashasetu"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          """)

          write_if_missing("app/src/main/AndroidManifest.xml", """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)

          write_if_missing("app/src/main/res/values/strings.xml", """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">BhashaSetu</string>
          </resources>
          """)

          write_if_missing("app/src/main/res/layout/activity_main.xml", """<?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <TextView
                  android:id="@+id/tvTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="BhashaSetu"
                  android:textSize="24sp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />
          </androidx.constraintlayout.widget.ConstraintLayout>
          """)

          write_if_missing("app/src/main/java/com/example/bhashasetu/MainActivity.kt", """package com.example.bhashasetu

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import com.example.bhashasetu.databinding.ActivityMainBinding

          class MainActivity : AppCompatActivity() {
              private lateinit var binding: ActivityMainBinding
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)
              }
          }
          """)
          EOF

      - name: Build debug APK
        run: |
          ROOT_DIR="."
          if [ ! -f "settings.gradle" ] && [ ! -f "app/build.gradle" ]; then
            for d in */; do
              if [ -f "${d}settings.gradle" ] || [ -d "${d}app" ]; then
                ROOT_DIR="$d"
                break
              fi
            done
          fi
          gradle -p "$ROOT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
